# Rate Limiting Zones (10MB memory can track ~160,000 unique IP addresses)
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/m;

# Return HTTP 429 (Too Many Requests) when rate limits are exceeded
limit_req_status 429;

server {
    listen 80;
    server_name localhost;

    # Trust external load balancer headers for accurate client IP tracking
    set_real_ip_from 0.0.0.0/0;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Standard JSON response for HTTP 429 Rate Limited requests
    error_page 429 /429.json;
    location = /429.json {
        default_type application/json;
        return 429 '{"detail":"Rate limit exceeded. Please slow down your requests."}';
    }

    # Frontend Single Page Application (SPA) routing (Not rate limited for fast browsing)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Stricter Rate Limiting for Authentication (Sign-up, Login) to prevent brute-force / CPU exhaustion
    location ^~ /api/auth {
        limit_req zone=auth_limit burst=5 nodelay;

        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # General API proxy with rate limiting (20 req/sec with burst buffer)
    location /api/ {
        limit_req zone=api_limit burst=30 nodelay;

        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy static uploads/assets to backend container
    location /static/ {
        proxy_pass http://backend:8000/static/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
