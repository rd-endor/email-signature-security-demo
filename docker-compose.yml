version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: signature-studio-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - JWT_SECRET_KEY=endor-signature-builder-secret-key-2026-supersecure
    volumes:
      - backend_data:/app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - signature-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: signature-studio-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - signature-network

  php:
    build:
      context: ./php
      dockerfile: Dockerfile
    container_name: signature-studio-php
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:80"
    networks:
      - signature-network

volumes:
  backend_data:

networks:
  signature-network:
    driver: bridge
